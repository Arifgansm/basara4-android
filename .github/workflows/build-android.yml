name: Basara 4 Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-libs:
    name: Build Native Libraries (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout basara4-android
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang

      - name: Cache FEXCore build
        uses: actions/cache@v4
        with:
          path: ~/fexcore-install
          key: fexcore-shared-android-${{ hashFiles('cpu/basara4cpu.cmake') }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26c
          local-cache: true

      - name: Build FEXCore (shared library)
        run: |
          cd third_party/FEX
          mkdir -p build_arm64
          cd build_arm64
          
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          
          echo "=== Configuring FEXCore ==="
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang \
            -DCMAKE_CXX_COMPILER=${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++ \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DENABLE_LTO=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF \
            -DBUILD_STEAM_SUPPORT=OFF \
            -DENABLE_FEX_ALLOCATOR=OFF \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DUSE_LINKER=lld \
            -G Ninja \
            2>&1 | tee /tmp/fex_configure.log | tail -20
          
          echo "=== Building FEXCore_shared ==="
          cmake --build . --target FEXCore_shared -j$(nproc) 2>&1 | tee /tmp/fex_build.log
          
          build_exit=$?
          echo "Build exit code: $build_exit"
          tail -50 /tmp/fex_build.log
          
          if [ $build_exit -ne 0 ]; then
            echo "BUILD FAILED"
            exit 1
          fi
          
          # Install FEXCore
          mkdir -p ~/fexcore-install/lib
          mkdir -p ~/fexcore-install/include
          
          echo "=== Finding libFEXCore.so ==="
          find . -name "libFEXCore.so" -exec ls -la {} \;
          find . -name "libFEXCore.so" -exec cp {} ~/fexcore-install/lib/ \;
          
          cp -r ../include/FEXCore ~/fexcore-install/include/ 2>/dev/null || true
          
          echo "=== FEXCore installed ==="
          ls -la ~/fexcore-install/lib/

      - name: Build basara4 runtime
        run: |
          mkdir -p build_android
          cd build_android
          
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          
          echo "=== Configuring basara4-android ==="
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${NDK_PATH}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_CPU=ON \
            -DBUILD_RUNTIME=ON \
            -DBUILD_GPU=OFF \
            -DFEXCORE_PATH=~/fexcore-install \
            2>&1 | tee /tmp/basara4_configure.log | tail -20
          
          echo "=== Building basara4runtime ==="
          cmake --build . --target basara4runtime -j$(nproc) 2>&1 | tee /tmp/basara4_build.log
          
          echo "=== Runtime built ==="
          find . -name "*.so" -exec ls -lh {} \;
          find . -name "*.a" -exec ls -lh {} \;

      - name: Prepare libraries for APK
        run: |
          mkdir -p launcher/src/main/jniLibs/arm64-v8a
          
          echo "=== Checking all possible library locations ==="
          echo "--- build_android ---"
          find build_android -type f \( -name "*.so" -o -name "*.a" \) -exec ls -la {} \;
          
          echo "--- fexcore-install ---"
          ls -la ~/fexcore-install/lib/ 2>/dev/null || echo "fexcore-install/lib not found"
          
          echo "--- src directory ---"
          find . -path "*/src/*" -name "*.so" -exec ls -la {} \; 2>/dev/null || true
          
          echo "--- Copying .so files from build_android ---"
          find build_android -name "*.so" -exec cp {} launcher/src/main/jniLibs/arm64-v8a/ \;
          
          echo "--- Copying libFEXCore.so ---"
          if [ -f ~/fexcore-install/lib/libFEXCore.so ]; then
            cp ~/fexcore-install/lib/libFEXCore.so launcher/src/main/jniLibs/arm64-v8a/
            echo "Copied libFEXCore.so"
          else
            echo "WARNING: libFEXCore.so not found in fexcore-install"
            # Try to find it
            find ~/fexcore-install -name "*.so" -exec ls -la {} \;
          fi
          
          echo "=== Final library list ==="
          ls -la launcher/src/main/jniLibs/arm64-v8a/
          
          echo "=== Checking for any .so files in workspace ==="
          find . -name "*.so" -type f 2>/dev/null | head -20

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: basara4-native-libs
          path: launcher/src/main/jniLibs/
          retention-days: 7
          if-no-files-found: error

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: build-libs
    if: always() && needs.build-libs.result == 'success'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: basara4-native-libs
          path: launcher/src/main/jniLibs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK
        working-directory: .
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: basara4-android-debug
          path: |
            launcher/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
