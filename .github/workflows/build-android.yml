name: Basara 4 Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-libs:
    name: Build Native Libraries (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout basara4-android
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: basara4-android

      - name: Show repository structure
        run: |
          echo "=== Repository ==="
          ls -la basara4-android/
          ls -la basara4-android/third_party/
          echo "=== Submodule status ==="
          cd basara4-android && git submodule status
          echo "=== Done ==="

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config python3

      - name: Setup Android NDK (using setup-ndk action)
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26c
          local-cache: true

      - name: Verify NDK installation
        run: |
          echo "NDK Path: ${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          ls -la "${{ steps.setup-ndk.outputs.ndk-path }}/"
          ls -la "${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/" | head -20

      - name: Configure FEXCore
        run: |
          cd basara4-android/third_party/FEX
          mkdir -p build_arm64
          cd build_arm64
          
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          echo "Building FEXCore for ARM64..."
          echo "NDK_PATH: $NDK_PATH"
          
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=~/fexcore-install \
            -DCMAKE_C_COMPILER=${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang \
            -DCMAKE_CXX_COMPILER=${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++ \
            -DCMAKE_TOOLCHAIN_FILE="" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DENABLE_LTO=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF \
            -DBUILD_STEAM_SUPPORT=OFF \
            -DENABLE_FEX_ALLOCATOR=OFF \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DENABLE_X86_HOST_DEBUG=ON \
            -DUSE_LINKER=lld \
            -G Ninja
          
          echo "Configuration successful!"
          ls -la

      - name: Build FEXCore
        run: |
          cd basara4-android/third_party/FEX/build_arm64
          cmake --build . --target FEXCore -j$(nproc)
          echo "Build complete!"
          
      - name: Install FEXCore
        run: |
          cd basara4-android/third_party/FEX/build_arm64
          cmake --install .
          echo "=== FEXCore installed ==="
          ls -la ~/fexcore-install/
          ls -la ~/fexcore-install/lib/ 2>/dev/null || echo "No lib dir"
          ls -la ~/fexcore-install/include/ 2>/dev/null || echo "No include dir"

      - name: Build basara4 runtime
        run: |
          cd basara4-android
          mkdir -p build_android
          cd build_android
          
          echo "=== Configuring basara4-android ==="
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_CPU=OFF \
            -DBUILD_RUNTIME=ON \
            -DBUILD_GPU=OFF \
            -DFEXCORE_PATH=~/fexcore-install
          
          cmake --build . --target basara4runtime -j$(nproc)
          echo "=== Runtime built ==="
          find . -name "*.so" -exec ls -lh {} \;

      - name: Combine libraries
        run: |
          cd basara4-android
          mkdir -p launcher/src/main/jniLibs/arm64-v8a
          find build_android -name "*.so" -exec cp {} launcher/src/main/jniLibs/arm64-v8a/ \;
          echo "=== Final libraries ==="
          ls -la launcher/src/main/jniLibs/arm64-v8a/

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: basara4-native-libs
          path: basara4-android/launcher/src/main/jniLibs/
          retention-days: 7
          if-no-files-found: error

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: build-libs
    if: always() && needs.build-libs.result == 'success'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: basara4-android

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: basara4-native-libs
          path: basara4-android/launcher/src/main/jniLibs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK
        working-directory: basara4-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: basara4-android-debug
          path: |
            basara4-android/launcher/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error