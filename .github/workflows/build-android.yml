name: Basara 4 Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-libs:
    name: Build Native Libraries (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout basara4-android
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: basara4-android

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config unzip

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: ndk;26.0.10792818

      - name: Download pre-built FEXCore
        run: |
          echo "Downloading FEXCore-2610 from Nightlies..."
          curl -L -o FEXCore-2610.zip \
            https://github.com/The412Banner/Nightlies/releases/download/FEXCore-2610/FEXCore-2610.wcp
          
          # It's a zip file
          unzip FEXCore-2610.zip -d fexcore_extract
          echo "Extracted files:"
          find fexcore_extract -type f -ls
          
          # Copy to jniLibs
          mkdir -p basara4-android/launcher/src/main/jniLibs/arm64-v8a
          find fexcore_extract -name "*.so" -exec cp {} basara4-android/launcher/src/main/jniLibs/arm64-v8a/ \;
          
          echo "FEXCore libraries ready"
          ls -la basara4-android/launcher/src/main/jniLibs/arm64-v8a/

      - name: Build basara4 runtime
        run: |
          cd basara4-android
          mkdir -p build_android
          cd build_android
          
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/26.0.10792818/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_RUNTIME=ON \
            -DBUILD_CPU=OFF \
            -DBUILD_GPU=OFF
          
          cmake --build . --target basara4runtime -j$(nproc)
          
          echo "Building basara4runtime..."
          find . -name "libbasara4runtime.so" -exec ls -lh {} \;

      - name: Combine libraries
        run: |
          cd basara4-android
          cp build_android/libbasara4runtime.so launcher/src/main/jniLibs/arm64-v8a/
          echo "Final jniLibs contents:"
          ls -la launcher/src/main/jniLibs/arm64-v8a/

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: basara4-native-libs
          path: basara4-android/launcher/src/main/jniLibs/
          retention-days: 7

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: build-libs
    if: always() && needs.build-libs.result == 'success'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: basara4-android

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: basara4-native-libs
          path: basara4-android/launcher/src/main/jniLibs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK
        working-directory: basara4-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: basara4-android-debug
          path: |
            basara4-android/launcher/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error