name: Basara 4 Android Build

on:
  push:
    branches: [main, master]
    paths:
      - 'basara4_android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'basara4_android/**'
  workflow_dispatch:

jobs:
  build-libs:
    name: Build Native Libraries (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_NDK_VERSION: r26c
      CMAKE_VERSION: 3.22.1

    steps:
      - name: Checkout basara4-android
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          local-cache: true

      - name: Cache FEXCore build
        uses: actions/cache@v4
        with:
          path: third_party/FEX/build_arm64
          key: fexcore-${{ runner.os }}-ndk${{ env.ANDROID_NDK_VERSION }}

      - name: Build FEXCore (shared library)
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          cd third_party/FEX
          
          rm -rf build_arm64
          mkdir -p build_arm64
          cd build_arm64
          
          echo "=== Configuring FEXCore ==="
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang \
            -DCMAKE_CXX_COMPILER=${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++ \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DENABLE_LTO=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF \
            -DBUILD_STEAM_SUPPORT=OFF \
            -DENABLE_FEX_ALLOCATOR=OFF \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DUSE_LINKER=lld \
            -G Ninja \
            2>&1 | tee /tmp/fex_configure.log | tail -30
          
          echo "=== Building FEXCore_shared ==="
          cmake --build . --target FEXCore_shared -j$(nproc) 2>&1 | tee /tmp/fex_build.log
          
          build_exit=$?
          echo "Build exit code: $build_exit"
          tail -50 /tmp/fex_build.log
          
          if [ $build_exit -ne 0 ]; then
            echo "FEXCore BUILD FAILED"
            exit 1
          fi
          
          # Install FEXCore
          mkdir -p ~/fexcore-install/lib
          mkdir -p ~/fexcore-install/include
          
          echo "=== All .so files found in FEX build ==="
          find . -name "*.so" -exec ls -la {} \;
          
          echo "=== Finding libFEXCore.so ==="
          find . -name "libFEXCore*" -exec ls -la {} \;
          find . -name "libFEXCore.so" -exec cp {} ~/fexcore-install/lib/ \;
          
          cp -r ../include/FEXCore ~/fexcore-install/include/ 2>/dev/null || true
          
          echo "=== FEXCore installed ==="
          ls -la ~/fexcore-install/lib/

      - name: Build basara4 runtime
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          cd basara4_android
          
          rm -rf build_android
          mkdir -p build_android
          cd build_android
          
          echo "=== Configuring basara4-android ==="
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${NDK_PATH}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_CPU=ON \
            -DBUILD_RUNTIME=ON \
            -DBUILD_GPU=OFF \
            -DFEXCORE_PATH=~/fexcore-install \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            2>&1 | tee /tmp/basara4_configure.log | tail -30
          
          echo "=== Building basara4runtime ==="
          cmake --build . --target basara4runtime -j$(nproc) 2>&1 | tee /tmp/basara4_build.log
          
          build_exit=$?
          echo "Build exit code: $build_exit"
          tail -50 /tmp/basara4_build.log
          
          echo "=== Runtime built ==="
          find . -name "*.so" -exec ls -lh {} \;
          find . -name "*.a" -exec ls -lh {} \;
          
          echo "=== All .so files in build tree ==="
          find . -name "*.so" -type f 2>/dev/null

      - name: Prepare libraries for APK
        run: |
          cd basara4_android
          
          mkdir -p launcher/src/main/jniLibs/arm64-v8a
          
          echo "=== Current directory ==="
          pwd
          echo "=== Launcher jniLibs exists? ==="
          ls -la launcher/src/main/jniLibs/ 2>/dev/null || echo "jniLibs does not exist"
          
          echo "=== All .so files in entire repo ==="
          find . -name "*.so" -type f -exec ls -lh {} \; 2>/dev/null
          
          echo "=== Copying from build_android ==="
          find build_android -name "*.so" -type f -exec echo "Found: {}" \; -exec cp {} launcher/src/main/jniLibs/arm64-v8a/ \;
          
          echo "=== Copying FEXCore ==="
          if [ -f ~/fexcore-install/lib/libFEXCore.so ]; then
            cp ~/fexcore-install/lib/libFEXCore.so launcher/src/main/jniLibs/arm64-v8a/
            echo "Copied libFEXCore.so"
          else
            echo "WARNING: libFEXCore.so not found"
          fi
          
          echo "=== Final library list ==="
          ls -la launcher/src/main/jniLibs/arm64-v8a/
          
          echo "=== Verifying artifact path ==="
          find launcher/src/main/jniLibs/ -type f

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: basara4-native-libs
          path: basara4_android/launcher/src/main/jniLibs/
          retention-days: 7
          if-no-files-found: error

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: build-libs
    if: always() && needs.build-libs.result == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: basara4-native-libs
          path: basara4_android/launcher/src/main/jniLibs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build APK
        working-directory: basara4_android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee /tmp/apk_build.log
          echo "APK build exit code: $?"
          tail -20 /tmp/apk_build.log

      - name: Verify APK
        working-directory: basara4_android
        run: |
          APK=$(find launcher/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          echo "APK: $APK"
          if [ -z "$APK" ]; then
            find launcher -name "*.apk" -exec echo "Found: {}" \;
            exit 1
          fi
          unzip -l "$APK" | grep -E "\.so$|assets|classes" | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: basara4-android-debug
          path: basara4_android/launcher/app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error
