name: Basara 4 Android Build

on:
  push:
    branches: [main, android-port]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - libs-only
          - apk-only

jobs:
  build-libs:
    name: Build Native Libraries (x86_64 cross-compile)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout basara4-android
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: basara4-android

      - name: Cache FEXCore build
        uses: actions/cache@v4
        id: fexcache
        with:
          path: ~/fexcore-build
          key: fexcore-${{ runner.os }}-${{ hashFiles('basara4-android/cpu/fex_project.cmake') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake=3.22.* \
            ninja-build \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            pkg-config \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libudev-dev

      - name: Download Android NDK
        run: |
          NDK_DIR=~/android-ndk
          if [ ! -d "$NDK_DIR" ]; then
            wget -q https://dl.google.com/android/repository/android-ndk-r26c-linux-x86_64.zip
            unzip -q android-ndk-r26c-linux-x86_64.zip -d ~/
          fi
          echo "NDK_DIR=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK=$NDK_DIR" >> $GITHUB_ENV

      - name: Clone FEXCore (if not cached)
        if: steps.fexcache.outputs.cache-hit != 'true'
        run: |
          git clone --depth=1 --recursive https://github.com/FEX-Emu/FEX.git ~/FEXCore
          mkdir -p ~/fexcore-build

      - name: Build FEXCore for arm64
        if: steps.fexcache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK: ~/android-ndk
        run: |
          cd ~/FEXCore
          cmake -B build_arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DFEX_ENABLE_LTO=ON \
            -DFEX_BUILD_DOC=OFF \
            -DFEX_DISABLE_LOADER=ON \
            -DBUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX=../fexcore-install \
            .
          cmake --build build_arm64 --target FEXCore -j$(nproc)
          cmake --install build_arm64
          mkdir -p ~/fexcore-build
          cp -r ../fexcore-install/* ~/fexcore-build/

      - name: Build Basara 4 runtime
        env:
          ANDROID_NDK: ~/android-ndk
        run: |
          cd basara4-android
          
          # Create build directory
          mkdir -p build_android
          cd build_android
          
          # Configure with CMake
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_CPU=ON \
            -DBUILD_RUNTIME=ON \
            -DBUILD_GPU=OFF \
            -DFEXCORE_PATH=~/fexcore-build \
            -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/jniLibs
          
          # Build
          cmake --build . --target basara4cpu basara4runtime -j$(nproc)
          cmake --install .
          
          # Copy to jniLibs structure
          mkdir -p launcher/src/main/jniLibs/arm64-v8a
          find lib -name "*.so" -exec cp {} launcher/src/main/jniLibs/arm64-v8a/ \;

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: basara4-native-libs
          path: |
            basara4-android/launcher/src/main/jniLibs/
          retention-days: 7

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: build-libs
    if: github.event.inputs.build_type == 'full' || github.event.inputs.build_type == 'apk-only'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: basara4-android

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: basara4-native-libs
          path: basara4-android/launcher/src/main/jniLibs

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Build APK
        working-directory: basara4-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: basara4-android-debug
          path: |
            basara4-android/launcher/build/outputs/apk/debug/*.apk
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-libs, build-apk]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download libs
        uses: actions/download-artifact@v4
        with:
          name: basara4-native-libs
          path: libs

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: basara4-android-debug
          path: apks

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apks/*.apk
            libs/**/*.so
        draft: false
        prerelease: true
