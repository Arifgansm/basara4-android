name: Basara 4 Android Build

on:
  push:
    branches: [main, android-port]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - libs-only
          - apk-only

jobs:
  build-libs:
    name: Build Native Libraries (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout basara4-android with FEXCore
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: basara4-android

      - name: Cache FEXCore build
        id: fexcache
        uses: actions/cache@v4
        with:
          path: ~/fexcore-install
          key: fexcore-arm64-${{ runner.os }}-${{ hashFiles('basara4-android/cpu/fex_project.cmake') }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake=3.22.* \
            ninja-build \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            pkg-config

      - name: Download Android NDK r26c
        run: |
          if [ ! -d "$HOME/android-ndk-r26c" ]; then
            echo "Downloading Android NDK r26c..."
            wget -q https://dl.google.com/android/repository/android-ndk-r26c-linux-x86_64.zip \
              -O /tmp/ndk.zip
            unzip -q /tmp/ndk.zip -d ~/
          fi
          echo "ANDROID_NDK=$HOME/android-ndk-r26c" >> $GITHUB_ENV

      - name: Build FEXCore for arm64
        env:
          ANDROID_NDK: ~/android-ndk-r26c
        run: |
          cd basara4-android/third_party/FEX
          
          echo "Configuring FEXCore for ARM64..."
          cmake -B _build_arm64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=aarch64-linux-android-clang \
            -DCMAKE_CXX_COMPILER=aarch64-linux-android-clang++ \
            -DUSE_LINKER=lld \
            -DENABLE_LTO=True \
            -DENABLE_ASSERTIONS=False \
            -DBUILD_TESTING=False \
            -DBUILD_THUNKS=False \
            -DBUILD_FEXCONFIG=False \
            -DBUILD_STEAM_SUPPORT=False \
            -DENABLE_FEX_ALLOCATOR=False \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=False \
            -DENABLE_X86_HOST_DEBUG=True \
            -DCMAKE_INSTALL_PREFIX=~/fexcore-install
          
          echo "Building FEXCore..."
          cmake --build _build_arm64 --target FEXCore -j$(nproc)
          cmake --install _build_arm64
          
          echo "FEXCore installed to ~/fexcore-install"
          ls -la ~/fexcore-install/lib/

      - name: Configure basara4-android build
        env:
          ANDROID_NDK: ~/android-ndk-r26c
        run: |
          cd basara4-android
          mkdir -p build_android
          cd build_android
          
          FEX_PATH="${{ steps.fexcache.outputs.cache-hit == 'true' && '~/fexcore-install' || 'third_party/FEX' }}"
          
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_CPU=ON \
            -DBUILD_RUNTIME=ON \
            -DBUILD_GPU=OFF \
            -DFEXCORE_PATH=$FEX_PATH \
            -DCMAKE_INSTALL_PREFIX=../jniLibs
          
          echo "CMake configuration complete"

      - name: Build basara4 native libraries
        env:
          ANDROID_NDK: ~/android-ndk-r26c
        run: |
          cd basara4-android/build_android
          cmake --build . --target basara4cpu basara4runtime -j$(nproc)
          cmake --install .
          
          mkdir -p launcher/src/main/jniLibs/arm64-v8a
          find lib -name "*.so" -exec cp {} launcher/src/main/jniLibs/arm64-v8a/ \;
          
          echo "Build complete!"
          ls -la launcher/src/main/jniLibs/arm64-v8a/

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: basara4-native-libs
          path: basara4-android/launcher/src/main/jniLibs/
          retention-days: 7
          if-no-files-found: error

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: build-libs
    if: always() && needs.build-libs.result == 'success'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: basara4-android

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: basara4-native-libs
          path: basara4-android/launcher/src/main/jniLibs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK with Gradle
        working-directory: basara4-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: basara4-android-debug
          path: |
            basara4-android/launcher/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

  release:
    name: Create Release (tags only)
    runs-on: ubuntu-latest
    needs: [build-libs, build-apk]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Download libs
        uses: actions/download-artifact@v4
        with:
          name: basara4-native-libs
          path: libs

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: basara4-android-debug
          path: apks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apks/*.apk
            libs/**/*.so
          draft: false
          prerelease: true
          body: |
            ## Build Info
            - FEXCore arm64 binary with FEXCore JIT
            - Basara 4 Runtime (PS4 syscalls, audio)
            - Android Debug APK