name: Basara 4 Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-runtime:
    name: Build Runtime Only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout basara4-android
        uses: actions/checkout@v4
        with:
          submodules: recursive
          path: basara4-android

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26c
          local-cache: true

      - name: Configure basara4-android with error capture
        run: |
          cd basara4-android
          mkdir -p build_android
          cd build_android
          
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          
          echo "=== Configuring basara4-android ==="
          echo "NDK_PATH: $NDK_PATH"
          ls -la $NDK_PATH/build/cmake/android.toolchain.cmake
          
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${NDK_PATH}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_CPU=OFF \
            -DBUILD_RUNTIME=ON \
            -DBUILD_GPU=OFF \
            2>&1 | tee /tmp/cmake_output.log
          
          exit_code=$?
          echo "=== CMake exit code: $exit_code ==="
          echo "=== Last 50 lines of output ==="
          tail -50 /tmp/cmake_output.log
          
          if [ $exit_code -ne 0 ]; then
            echo "=== CMake configuration failed ==="
            exit 1
          fi

      - name: Build basara4runtime
        run: |
          cd basara4-android/build_android
          cmake --build . --target basara4runtime -j$(nproc)
          echo "=== Runtime built ==="
          find . -name "*.so" -exec ls -lh {} \;

      - name: Prepare libraries for APK
        run: |
          cd basara4-android
          mkdir -p launcher/src/main/jniLibs/arm64-v8a
          
          find build_android -name "libbasara4runtime.so" -exec cp {} launcher/src/main/jniLibs/arm64-v8a/ \;
          
          echo "=== Libraries ==="
          ls -la launcher/src/main/jniLibs/arm64-v8a/

      - name: Upload native libraries
        uses: actions/upload-artifact@v4
        with:
          name: basara4-runtime-libs
          path: basara4-android/launcher/src/main/jniLibs/
          retention-days: 7
          if-no-files-found: error

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: build-runtime
    if: always() && needs.build-runtime.result == 'success'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: basara4-android

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          name: basara4-runtime-libs
          path: basara4-android/launcher/src/main/jniLibs

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build APK
        working-directory: basara4-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: basara4-android-debug
          path: |
            basara4-android/launcher/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error